<!-- Personal notes layer (html-notes skill). Notes live in __NOTES_FILE__ next to this file.
     Each note is attached to a block (paragraph, equation, figure, ...) by a fingerprint of its text,
     so notes survive edits elsewhere in the page. A note whose block was edited follows it (matched by
     word overlap and by its old neighbours); a note whose block was deleted is listed as "unattached".
     Sync: in Chrome the page writes every change to the notes file at once (File System Access API, after a
     one-time "choose folder" step), and re-reads the file when the tab regains focus; changes from two places
     are merged by note id. Other browsers show the notes read-only. Re-run add_notes.py to update this block.
     Highlights: select text, pick a colour or add a note. A highlight is stored with its block like a note, plus
     its words and the 32 characters on each side, and is drawn with the CSS Custom Highlight API (no DOM change).
     AI queue: "For AI" marks a note (ai:true) for an AI, which records the outcome with resolve_notes.py
     (status fixed/answered/declined + resolution); the card shows it, and resolved notes can be hidden.
     Strike: crossed-out words (strike:true) are queued for the AI to delete. Step-through: the toolbar's
     ◀ ▶ (or the ← → keys) visit all items, the AI results not yet reviewed, or the notes whose paragraph changed (n.was). -->
<style>
/* z-index near the maximum, so no page element covers the layer; the layer's own order: + < bar, panel < popup < dialog, message */
.wmn-banner,.wmn-card,.wmn-bar,.wmn-panel,.wmn-add,.wmn-pop,.wmn-toast{--wmn-accent:#C9932B;--wmn-soft:#F1E4C4;--wmn-paper:#FFF8E1;--wmn-ink:#1C2B33;--wmn-ink2:#4A5A63;--wmn-rule:#C9D3D6;--wmn-loss:#A63D40;--wmn-sans:"Avenir Next","Avenir","Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--wmn-ink);font-weight:400}   /* not the page's weight: a light page font made notes faint */
.wmn-banner{font-family:var(--wmn-sans);font-size:.85rem;background:var(--wmn-soft);border-bottom:1px solid var(--wmn-accent);padding:6px 16px;text-align:center}
.wmn-btn{font-family:var(--wmn-sans);font-size:.75rem;line-height:1.4;background:var(--wmn-ink);color:#fff;border:1px solid var(--wmn-ink);border-radius:0;padding:2px 8px;margin:0;cursor:pointer}
.wmn-btn.alt{background:#fff;color:var(--wmn-ink)}
.wmn-add{position:absolute;z-index:2147483000;display:none;width:22px;height:22px;padding:0;border:0;border-radius:50%;background:var(--wmn-accent);color:#fff;font:600 16px/22px var(--wmn-sans);text-align:center;opacity:.85;cursor:pointer}
.wmn-add:hover{opacity:1}
.wmn-card{font-family:var(--wmn-sans);font-size:.9rem;line-height:1.45;text-align:left;background:var(--wmn-paper);border:1px solid var(--wmn-accent);border-left:4px solid var(--wmn-accent);padding:8px 12px;margin:-6px 0 18px;list-style:none}
.wmn-text,.wmn-card textarea{color:#1A1A1A}   /* note text: 90% gray */
.wmn-text{white-space:pre-wrap}
.wmn-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.75rem;color:var(--wmn-ink2);margin-top:6px}
.wmn-card textarea{box-sizing:border-box;width:100%;min-height:90px;font:inherit;border:1px solid var(--wmn-rule);padding:6px}
.wmn-bar{position:fixed;left:12px;right:12px;bottom:12px;z-index:2147483001;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-sizing:border-box;font-family:var(--wmn-sans);font-size:.8rem;background:#fff;border:1px solid var(--wmn-rule);box-shadow:0 2px 8px rgba(0,0,0,.12);padding:6px 10px}
.wmn-bar.wmn-off{display:none}

.wmn-dialog p{margin:0 0 10px}
.wmn-panel{position:fixed;right:12px;bottom:56px;z-index:2147483001;display:none;box-sizing:border-box;width:min(440px,calc(100vw - 24px));max-height:60vh;overflow:auto;background:#fff;border:1px solid var(--wmn-rule);box-shadow:0 2px 8px rgba(0,0,0,.12);padding:10px}
.wmn-panel .wmn-card{margin:0 0 10px}
.wmn-old{font-size:.75rem;color:var(--wmn-ink2);margin-bottom:4px}
.wmn-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
.wmn-card.wmn-closed{padding:3px 10px}

.wmn-preview{flex:1;min-width:8em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;color:#1A1A1A}

.wmn-count{font-size:.75rem;color:var(--wmn-ink2)}
.wmn-ico{font-family:var(--wmn-sans);font-size:.85rem;line-height:1.2;background:none;border:1px solid transparent;border-radius:3px;padding:1px 5px;margin:0;cursor:pointer;color:var(--wmn-ink)}
.wmn-ico:hover{border-color:var(--wmn-rule);background:#fff}
.wmn-ico.on{background:#3B5BA9;border-color:#3B5BA9}
button.wmn-tag{cursor:pointer;background:#fff;font-family:inherit;line-height:inherit}
.wmn-me{margin-top:6px}
.wmn-old del{color:var(--wmn-loss)}
.wmn-old ins{color:#2E6B34;text-decoration:underline}
.wmn-tag{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.03em;padding:0 6px;margin-right:6px;border:1px solid;border-radius:2px}
.wmn-tag.ai{color:#fff;background:#3B5BA9;border-color:#3B5BA9}
.wmn-tag.fixed{color:#2E6B34}
.wmn-tag.answered{color:#3B5BA9}
.wmn-tag.declined{color:var(--wmn-loss)}
.wmn-tag.strike{color:#C0392B}
.wmn-tag.was{color:#8A5A00}
.wmn-flash{animation:wmn-flash 1.7s}
@keyframes wmn-flash{0%,60%{outline:3px solid #3B5BA9;outline-offset:3px}100%{outline:3px solid transparent;outline-offset:3px}}
.wmn-reply{margin-top:6px;padding:4px 8px;background:#fff;border-left:3px solid var(--wmn-rule);white-space:pre-wrap;color:#1A1A1A}
.wmn-card.wmn-queued{border-left-color:#3B5BA9}
.wmn-card.wmn-done{border-color:var(--wmn-rule);border-left-color:#8A9A9F}
body.wmn-hide .wmn-card:not(.wmn-panel .wmn-card){display:none}

.wmn-target{outline:2px dashed #C9932B;outline-offset:2px}
.wmn-pop{position:absolute;z-index:2147483002;display:none;gap:6px;align-items:center;background:#fff;border:1px solid var(--wmn-rule);box-shadow:0 2px 8px rgba(0,0,0,.18);padding:4px 6px}
.wmn-sw{width:20px;height:20px;padding:0;border:1px solid var(--wmn-ink2);border-radius:50%;cursor:pointer}
.wmn-sw.on{outline:2px solid var(--wmn-ink);outline-offset:1px}
.wmn-quote{font-size:.8rem;font-style:italic;color:var(--wmn-ink2);border-left:4px solid;padding-left:8px;margin-bottom:6px}
.wmn-toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:2147483003;font-family:var(--wmn-sans);font-size:.85rem;background:var(--wmn-ink);color:#fff;padding:4px 12px;opacity:0;transition:opacity .3s;pointer-events:none}
.wmn-toast.on{opacity:.92}
@media print{.wmn-banner,.wmn-add,.wmn-bar,.wmn-panel,.wmn-dialog,.wmn-pop,.wmn-toast,.wmn-pad{display:none!important}}
</style>
<script>
(function(){
'use strict';
const FILE='__NOTES_FILE__', HTML='__HTML_FILE__';
const KEY=location.pathname, DIRKEY='dir:'+KEY.replace(/[^/]*$/,''), LS='wmn-pending:'+KEY, LSHIDE='wmn-hide:'+KEY, LSDONE='wmn-hide-done:'+KEY, LSKEYS='wmn-keys:'+KEY, LSBAR='wmn-bar-off:'+KEY;
const BLOCKS='p,li,dt,dd,h1,h2,h3,h4,h5,h6,.eq,figure,table,pre,blockquote,.note,.diffnote,.widget';
const OURS='.wmn-card,.wmn-bar,.wmn-panel,.wmn-banner,.wmn-add,.wmn-pop,.wmn-toast,.wmn-pad';
const canSave=!!window.showDirectoryPicker;
/* Where keys belong to the page: TYPING for Esc (text entry only; a focused slider or button must not block Esc),
   OWNKEYS for the arrows (also sliders, which use them, and anything inside an interactive widget) */
const TYPING='textarea,select,[contenteditable=""],[contenteditable="true"],input:not([type=range]):not([type=checkbox]):not([type=radio]):not([type=button]):not([type=submit]):not([type=reset]):not([type=color]):not([type=file])';
const OWNKEYS=TYPING+',input[type=range],.widget';
const inside=(t,sel)=>!!(t&&t.closest&&t.closest(sel));
const COLORS={y:'rgba(255,214,0,.45)',g:'rgba(110,205,90,.4)',b:'rgba(90,170,255,.38)',p:'rgba(255,110,170,.38)'};
const canPaint=!!(window.CSS&&CSS.highlights&&window.Highlight);
const DELIMS=[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}];
let data=(window.NOTES&&Array.isArray(window.NOTES.notes))?window.NOTES:{version:1,updated:'',notes:[]};
let dirty=false, dirH=null, fileH=null, diskStamp=null, busy=false, again=false, picking=null, target=null, ROOT=null;
const where=new Map();      // note id -> block element
const rng=new Map();        // highlight id -> Range over its words
const index=new Map();      // tag|fingerprint -> [blocks, in document order]
const now=()=>new Date().toISOString();
const el=(tag,cls,txt)=>{const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e;};
const btn=(txt,fn,alt)=>{const b=el('button','wmn-btn'+(alt?' alt':''),txt); b.type='button'; b.onclick=fn; return b;};
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){}};

/* ---- block identity: text with KaTeX math reduced to its TeX source, so it is the same before and after rendering ---- */
function textOf(b){
  const c=b.cloneNode(true);
  c.querySelectorAll(OURS+',svg,canvas,output,script,style,mjx-container,.MathJax').forEach(e=>e.remove());
  c.querySelectorAll('.katex').forEach(k=>{const a=k.querySelector('annotation'); k.replaceWith(a?a.textContent:'');});
  return c.textContent;
}
const fp=b=>textOf(b).replace(/[\s$]+/g,'').slice(0,120);
const snip=(b,n)=>b?textOf(b).replace(/\s+/g,' ').trim().slice(0,n):'';

/* ---- fuzzy identity, for blocks whose text was edited: word overlap (Dice) of the block and of its two neighbours ---- */
const STOP=new Set('the and that this with for are was were from into its not but has have can which when what each one two than then they their there these those also only more most such use used uses will would does did been being any all how why who our you your about over under between per via both other some same very just'.split(' '));
function toks(s){ const m=new Map(); for(const w of (s||'').toLowerCase().match(/[a-z0-9]+/g)||[]) if((w.length>2||/^\d+$/.test(w))&&!STOP.has(w)) m.set(w,(m.get(w)||0)+1); return m; }
function dice(a,b){ let n=0,d=0; for(const [w,c] of a){ d+=c; if(b.has(w)) n+=Math.min(c,b.get(w)); } for(const c of b.values()) d+=c; return d?2*n/d:0; }
let LIST=[];                // all blocks in document order
const TOK=new Map(), tk=b=>TOK.get(b)||TOK.set(b,toks(textOf(b))).get(b);
function context(n,b){ const i=LIST.indexOf(b); n.txt=snip(b,2000); n.prev=i>0?snip(LIST[i-1],600):''; n.next=i>=0?snip(LIST[i+1],600):''; n.sec=secOf(b); }
/* The headings above a block, outermost first: the section the note is in, given to the AI as context */
function secOf(b){
  const out=[]; let lvl=7;
  for(let j=LIST.indexOf(b)-1;j>=0&&lvl>1;j--){ const m=/^H([1-6])$/.exec(LIST[j].tagName); if(m&&+m[1]<lvl){ lvl=+m[1]; out.unshift(snip(LIST[j],120)); } }
  return out;
}
function best(t,from,to,min){ let j0=-1; for(let j=from;j<to;j++){ const v=dice(t,tk(LIST[j])); if(v>=min){ min=v; j0=j; } } return j0; }
/* An edited paragraph still sits between its old neighbours: take the most similar block between them.
   If the neighbours are now adjacent, the paragraph was deleted. If the neighbours changed too, use similarity alone. */
function follow(n){
  if(!n.txt) return null;
  const t=toks(n.txt), pj=n.prev?best(toks(n.prev),0,LIST.length,.6):-1, nj=n.next?best(toks(n.next),0,LIST.length,.6):-1;
  if(pj>=0&&nj>pj&&nj-pj<=6){ const j=best(t,pj+1,nj,.15); return j>=0?LIST[j]:null; }
  const j=best(t,0,LIST.length,.5); return j>=0?LIST[j]:null;
}
const keyOf=b=>b.tagName+'|'+fp(b);
function anchorOf(b){
  let id='';
  for(const e of ROOT.querySelectorAll('[id]')){
    if(e.closest('svg')||e.matches('canvas,input,output,select,textarea')) continue;
    if(e===b||(e.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING)) id=e.id; else break;
  }
  return id;
}
const blockAt=t=>{const b=t&&t.closest&&t.closest(BLOCKS); return b&&ROOT.contains(b)&&!b.closest(OURS)?b:null;};
const listFor=b=>{const k=keyOf(b), l=index.get(k)||index.set(k,[]).get(k); if(!l.includes(b)) l.push(b); return l;};

/* ---- highlights: a passage inside a block, found again by its words and the words around them ---- */
const SKIP=OURS+',.katex,svg,script,style,textarea,mjx-container,.MathJax';
function flat(b){            // the block's visible text, whitespace runs collapsed, and the text node + offset of each character
  const s=[], map=[], w=document.createTreeWalker(b,NodeFilter.SHOW_TEXT);
  for(let t;(t=w.nextNode());){
    if(t.parentElement.closest(SKIP)) continue;
    for(let o=0;o<t.data.length;o++){ const sp=/\s/.test(t.data[o]); if(sp&&s[s.length-1]===' ') continue; s.push(sp?' ':t.data[o]); map.push([t,o]); }
  }
  return {s:s.join(''),map};
}
const common=(a,b,back)=>{ let i=0; while(i<a.length&&i<b.length&&(back?a[a.length-1-i]===b[b.length-1-i]:a[i]===b[i])) i++; return i; };
function locate(b,h){        // a Range over h.quote in block b; if the words repeat, the copy whose surroundings match best
  if(!h.quote) return null;
  const {s,map}=flat(b), L=h.quote.length; let i0=-1, top=-Infinity;
  for(let i=s.indexOf(h.quote);i>=0;i=s.indexOf(h.quote,i+1)){
    const v=common(s.slice(Math.max(0,i-32),i),h.pre||'',true)+common(s.slice(i+L,i+L+32),h.suf||'',false)-Math.abs(i-(h.at||0))/1e4;
    if(v>top){ top=v; i0=i; }
  }
  if(i0<0) return null;
  const a=map[i0], z=map[i0+L-1], r=document.createRange(); r.setStart(a[0],a[1]); r.setEnd(z[0],z[1]+1); return r;
}
function grab(b,r){          // the part of selection r inside block b (a selection that runs on into the next block is cut there)
  const {s,map}=flat(b); let a=-1, z=-1;
  map.forEach(([t,o],i)=>{ if(r.comparePoint(t,o)===0&&r.comparePoint(t,o+1)===0){ if(a<0) a=i; z=i; } });
  while(a>=0&&a<=z&&s[a]===' ') a++; while(z>=a&&s[z]===' ') z--;
  return a<0||z<a?null:{quote:s.slice(a,z+1),pre:s.slice(Math.max(0,a-32),a),suf:s.slice(z+1,z+33),at:a};
}
function paint(){
  if(!canPaint) return;
  const g={};
  const done=document.body.classList.contains('wmn-hide-done');
  if(!document.body.classList.contains('wmn-hide')) for(const n of data.notes){ const r=rng.get(n.id), k=n.strike?'strike':n.hl&&n.hl.color; if(r&&n.hl&&!(n.status&&done)) (g[k]=g[k]||[]).push(r); }
  for(const k of [...Object.keys(COLORS),'strike']) CSS.highlights.set('wmn-'+k,new Highlight(...(g[k]||[])));
}
const STATUS={fixed:'Fixed',answered:'Answered',declined:'Declined'};
const shown=n=>!!(n.text||n.status||n.resolution||n.was||(n.ai&&!n.strike));   // a plain highlight or a queued strike has no card
const quoteOf=n=>{ if(!n.hl) return []; const q=n.hl.quote, d=el('div','wmn-quote','“'+(q.length>200?q.slice(0,200)+'…':q)+'”'); d.style.borderColor=n.strike?'#C0392B':COLORS[n.hl.color]||COLORS.y; if(n.strike) d.style.textDecoration='line-through'; return [d]; };

/* ---- rendering ---- */
function after(b,c){ let r=b; while(r.nextElementSibling&&r.nextElementSibling.classList.contains('wmn-card')) r=r.nextElementSibling; r.after(c); }
function math(e){
  if(window.renderMathInElement) renderMathInElement(e,{delimiters:DELIMS,throwOnError:false});
  else if(window.MathJax&&MathJax.typesetPromise) MathJax.typesetPromise([e]).catch(()=>{});
}
/* A note is a conversation: the note itself (n.text), then n.thread, a list of turns {who:'me'|'ai', text, at, status}.
   Older notes have no thread; their AI replies are in n.history and n.resolution. */
function turns(n){
  const t=n.text?[{who:'me',text:n.text,at:n.created}]:[];
  if(n.thread) return t.concat(n.thread);
  for(const h of [...(n.history||[]),n]) if(h.resolution) t.push({who:'ai',text:h.resolution,status:h.status,at:h.resolved});
  return t;
}
const lastMine=n=>{ const t=n.thread; return t&&t.length&&t[t.length-1].who==='me'?t[t.length-1]:null; };
const answered=n=>turns(n).some(t=>t.who==='ai');
function thread(T,skip){
  return T.filter(t=>t!==skip).map((t,i)=>{
    const d=t.who==='ai'?el('div','wmn-reply','AI'+(t.status?' ('+(STATUS[t.status]||t.status).toLowerCase()+')':'')+': '+t.text)
                        :el('div','wmn-text'+(i?' wmn-me':''),(i?'You: ':'')+t.text);
    math(d); return d;
  });
}
const ico=(t,label,fn,on)=>{ const b=btn(t,fn); b.className='wmn-ico'+(on?' on':''); b.title=label; b.setAttribute('aria-label',label); return b; };
/* Open or close a note; the state is saved in the notes file */
function toggle(n){ if(n.collapsed) delete n.collapsed; else n.collapsed=true; n.updated=now(); redraw(n); changed(); }
/* A card: a header row (open/close, status, tags, icons), then, when open, the conversation and a footer.
   A closed card is the header alone, with the first words of the note. */
function card(n){
  const closed=!!n.collapsed, T=turns(n);
  const c=el('div','wmn-card'+(n.ai?' wmn-queued':n.status?' wmn-done':'')+(closed?' wmn-closed':'')); c.dataset.id=n.id;
  const h=el('div','wmn-head');
  h.append(ico(closed?'▸':'▾',closed?'Open note':'Close note',()=>toggle(n)));
  if(n.strike) h.append(el('span','wmn-tag strike','Delete'));
  if(n.ai) h.append(el('span','wmn-tag ai','For AI'));
  if(n.status){
    const s=el(canSave&&!n.reviewed?'button':'span','wmn-tag '+n.status,(STATUS[n.status]||n.status)+(n.reviewed?' ✓':''));
    if(canSave&&!n.reviewed){ s.type='button'; s.title='Mark reviewed'; s.onclick=()=>reviewed(n); } else if(n.reviewed) s.title='Reviewed';
    h.append(s);
  }
  if(n.was) h.append(el('span','wmn-tag was','Paragraph changed'));
  if(closed){ const q=n.text||(n.hl?'“'+n.hl.quote+'”':''), pv=el('span','wmn-preview',q.length>90?q.slice(0,90)+'…':q); pv.onclick=()=>toggle(n); h.append(pv); }
  else h.append(el('span','wmn-grow'));
  // exchanges (your question and the AI's answer): shown only on a closed note that hides a real conversation
  const ex=T.filter(t=>t.who==='me').length||(T.length?1:0);
  if(closed&&ex>1){ const k=el('span','wmn-count','💬'+ex); k.title=ex+' exchanges'; h.append(k); }
  if(canSave){
    h.append(ico('🤖','For AI',()=>toggleAI(n),n.ai));
    if(lastMine(n)||!answered(n)) h.append(ico('✎','Edit',()=>edit(n,c,false,lastMine(n)||undefined)));
    h.append(ico('🗑',n.strike?'Remove strike':'Delete',()=>n.strike?unstrike(n):del(n)));
  }
  c.append(h);
  if(closed) return c;
  const m=el('div','wmn-meta'), last=T.length?T[T.length-1].at:n.created;
  m.append(el('span','',(last||n.updated||'').slice(0,16).replace('T',' ')));
  if(canSave&&((n.status&&!n.reviewed)||n.was)) m.append(btn('Reviewed',()=>reviewed(n)));
  // Reply answers the AI, so it appears only when the AI has the last word; before that, ✎ edits your message
  if(canSave&&T.length&&T[T.length-1].who==='ai') m.append(btn('Reply to AI',()=>edit(n,c,false,{who:'me',text:''}),true));
  const cl=btn('Close note',()=>toggle(n),true); m.append(cl);
  // a second close button, at the bottom, only on a tall note, where the ▾ at the top may be off screen
  requestAnimationFrame(()=>{ const h0=c.offsetHeight; if(h0&&h0<12*(parseFloat(getComputedStyle(c).lineHeight)||20)) cl.remove(); });
  c.append(...quoteOf(n));
  if(n.was){
    c.append(wasEl(n));
    // hovering the note marks the paragraph's new words in the page
    c.addEventListener('mouseenter',()=>showDiff(n)); c.addEventListener('mouseleave',()=>showDiff(null));
  }
  c.append(...thread(T),m); return c;
}
/* Edit the note itself, or (turn given) write a reply or change your latest reply. A new reply queues the note. */
function edit(n,c,isNew,turn){
  const ta=el('textarea'); ta.value=turn?turn.text:n.text||''; ta.placeholder=(turn?'Your reply':'Your note')+'. $math$ works. Ctrl/Cmd+Enter saves, Esc cancels.';
  const ok=btn(turn?'Send':'Save note',()=>{
    const t=ta.value.trim();
    if(turn){
      if(t){
        if(!n.thread){ n.thread=turns(n).slice(n.text?1:0); delete n.history; }
        if(!n.thread.includes(turn)){ n.thread.push(turn); n.ai=true; delete n.status; delete n.reviewed; }
        turn.text=t; turn.at=now(); delete n.collapsed; n.updated=now(); changed();
      }
      c.replaceWith(card(n)); return;
    }
    if(!t&&!n.hl){ if(isNew) c.remove(); else del(n,true); return; }   // an empty note on a highlight keeps the highlight
    n.text=t; n.updated=now(); if(!data.notes.includes(n)) data.notes.push(n);
    if(shown(n)) c.replaceWith(card(n)); else c.remove(); changed();
  });
  const no=btn('Cancel',()=>{ if(turn) c.replaceWith(card(n)); else if(!data.notes.includes(n)||!shown(n)) c.remove(); else c.replaceWith(card(n)); },true);
  const m=el('div','wmn-meta'); m.append(ok,no);
  ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)) ok.click(); if(e.key==='Escape') no.click(); });
  ['keydown','keypress','keyup'].forEach(t=>ta.addEventListener(t,e=>e.stopPropagation()));   // typing must not trigger the page's own shortcuts (slide decks)
  c.classList.remove('wmn-closed');
  c.replaceChildren(...quoteOf(n),...(turn?thread(turns(n),turn):[]),ta,m); ta.focus();
}
function del(n,quiet){
  if(!quiet&&!confirm(n.strike?'Remove this strike-through?':n.hl?'Delete this highlight'+(n.text?' and its note?':'?'):'Delete this note?')) return;
  data.notes=data.notes.filter(x=>x!==n); where.delete(n.id); rng.delete(n.id); paint(); (data.deleted=data.deleted||[]).push(n.id);
  document.querySelectorAll('.wmn-card[data-id="'+n.id+'"]').forEach(c=>c.remove());
  changed(); panel();
}
/* Queue a note for the AI, or take it off the queue. Queuing again reopens a resolved note. */
function toggleAI(n){
  if(n.ai) delete n.ai; else { n.ai=true; delete n.status; delete n.reviewed; }
  n.updated=now(); if(!data.notes.includes(n)) data.notes.push(n); redraw(n); paint(); changed();
}
/* A strike is removed at once, without a dialog; the toolbar offers Undo for 10 seconds */
let undoT=null;
function unstrike(n){
  del(n,true); clearTimeout(undoT);
  const clear=()=>{ status.textContent=''; };
  status.replaceChildren(el('span','','Strike removed. '),btn('Undo',()=>{
    data.deleted=(data.deleted||[]).filter(x=>x!==n.id); n.updated=now(); data.notes.push(n);
    clear(); rerender(); changed();
  },true));
  undoT=setTimeout(clear,10000);
}
/* "Reviewed": an AI result or a changed paragraph the reader has checked; it leaves the step-through lists */
function reviewed(n){ if(n.status) n.reviewed=now(); delete n.was; n.collapsed=true; n.updated=now(); redraw(n); changed(); }   // reviewing closes the note
/* A note keeps its paragraph's text. If the text changed while the note was not resolved, keep the old text
   in n.was until the reader clicks Reviewed. Widgets are skipped: their text can change on every load. */
function seen(n,b){
  const sec=()=>{ if(n.sec) return 0; n.sec=secOf(b); return 1; };   // older notes: record their headings once
  if(n.txt&&b.matches('.widget')) return sec();
  const t=snip(b,2000); if(n.txt===t) return sec();
  if(n.txt&&!n.status&&!n.ai&&!n.was){ n.was=n.txt; delete n.collapsed; }   // a changed paragraph opens its note, so the reader sees the change
  context(n,b); return 1;
}
/* "Paragraph changed": a word-level comparison of the old text (n.was) with the current one (n.txt). Approximate:
   whole words, and words inside formulas are not marked in the page. */
const words=t=>(t||'').split(/\s+/).filter(Boolean);
function diff(a,b){             // longest common subsequence of words -> [['='|'-'|'+', word], ...], or null if too long
  const N=a.length, M=b.length; if(N*M>250000) return null;
  const L=Array.from({length:N+1},()=>new Uint16Array(M+1));
  for(let i=N-1;i>=0;i--) for(let j=M-1;j>=0;j--) L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[]; let i=0, j=0;
  while(i<N&&j<M){ if(a[i]===b[j]){ out.push(['=',a[i]]); i++; j++; } else if(L[i+1][j]>=L[i][j+1]) out.push(['-',a[i++]]); else out.push(['+',b[j++]]); }
  while(i<N) out.push(['-',a[i++]]); while(j<M) out.push(['+',b[j++]]);
  return out;
}
/* The note's view of the change: removed words struck, new words underlined, long unchanged runs shortened */
function wasEl(n){
  const d=el('div','wmn-old','Changes in the paragraph: '), ops=diff(words(n.was),words(n.txt));
  if(!ops){ d.append('before: '+n.was.slice(0,300)+'…'); return d; }
  let run=[], kind=null;
  const flush=()=>{
    if(!run.length) return;
    if(kind==='=') d.append((run.length>10?run.slice(0,4).join(' ')+' … '+run.slice(-4).join(' '):run.join(' '))+' ');
    else d.append(el(kind==='-'?'del':'ins','',run.join(' ')),' ');
    run=[];
  };
  for(const [k,w] of ops){ if(k!==kind){ flush(); kind=k; } run.push(w); }
  flush(); return d;
}
/* Ranges over the new words in the page, found by their text; runs that cannot be found are skipped */
function changedRanges(n){
  const b=where.get(n.id), ops=b&&n.was?diff(words(n.was),words(n.txt)):null; if(!ops) return [];
  const runs=[]; let cur=[];
  for(const [k,w] of ops){ if(k==='+') cur.push(w); else if(k==='='&&cur.length){ runs.push(cur.join(' ')); cur=[]; } }
  if(cur.length) runs.push(cur.join(' '));
  const {s,map}=flat(b), out=[]; let from=0;
  for(const q of runs){
    const i=s.indexOf(q,from); if(i<0) continue;
    const z=map[i+q.length-1], r=document.createRange(); r.setStart(map[i][0],map[i][1]); r.setEnd(z[0],z[1]+1); out.push(r); from=i+q.length;
  }
  return out;
}
function showDiff(n){ if(canPaint) CSS.highlights.set('wmn-diff',new Highlight(...(n?changedRanges(n):[]))); }
function redraw(n){
  const c=document.querySelector('.wmn-card[data-id="'+n.id+'"]'), b=where.get(n.id);
  if(c){ if(shown(n)) c.replaceWith(card(n)); else c.remove(); } else if(b&&shown(n)) after(b,card(n));
}
function place(){
  LIST=[...ROOT.querySelectorAll(BLOCKS)].filter(b=>!b.closest(OURS));
  LIST.forEach(listFor); rng.clear();
  let moved=0;
  for(const n of data.notes){
    const list=index.get(n.tag+'|'+n.fp)||[];
    let b=list.length>1?(list.filter(x=>anchorOf(x)===n.anchor)[0]||list[Math.min(n.k||0,list.length-1)]):list[0];
    if(b) moved+=seen(n,b);
    else if((b=follow(n))){ moved++; Object.assign(n,{tag:b.tagName,fp:fp(b),anchor:anchorOf(b),k:listFor(b).indexOf(b)}); seen(n,b); }
    let r=null; if(b&&n.hl&&!(r=locate(b,n.hl))&&!n.status) b=null;   // a highlight whose words are gone is unattached, unless resolved (fixing changes the words)
    if(b){ where.set(n.id,b); if(r) rng.set(n.id,r); if(shown(n)) after(b,card(n)); }
  }
  paint(); return moved;
}
const orphans=()=>data.notes.filter(n=>!where.has(n.id));

/* ---- toolbar and unattached-notes panel ---- */
const bar=el('div','wmn-bar'), info=el('span'), status=el('span'), pnl=el('div','wmn-panel');
const hideBtn=btn('',()=>{ document.body.classList.toggle('wmn-hide'); lsSet(LSHIDE,document.body.classList.contains('wmn-hide')?'1':null); bar_(); paint(); },true);
const orphBtn=btn('',()=>{ pnl.style.display=pnl.style.display==='block'?'none':'block'; panel(); },true);
const aiInfo=el('span'), doneBtn=btn('',()=>{ document.body.classList.toggle('wmn-hide-done'); lsSet(LSDONE,document.body.classList.contains('wmn-hide-done')?'1':null); bar_(); paint(); },true);
const allBtn=btn('All for AI',()=>{ const open=data.notes.filter(n=>!n.ai&&!n.status); if(!open.length) return; for(const n of open){ n.ai=true; n.updated=now(); } changed(); rerender(); },true);
const clrBtn=btn('Clear',()=>{ for(const n of data.notes) if(n.ai){ delete n.ai; n.updated=now(); } changed(); rerender(); },true);
allBtn.title='Queue every open note and highlight for the AI'; clrBtn.title='Take every note off the AI queue';
/* step-through: ◀ ▶ visit the items of the chosen list in page order, and flash each one */
const MODES={all:['All',n=>true],review:['To review',n=>n.status&&!n.reviewed],changed:['Text changed',n=>n.was]};
const navSel=el('select','wmn-btn alt'), navPos=el('span'), prevB=btn('◀',()=>jump(-1),true), nextB=btn('▶',()=>jump(1),true);
let mode='all', cur=-1, hoverId=null;   // hoverId: the note under the pointer
navSel.setAttribute('aria-label','Step through'); prevB.title='Previous'; nextB.title='Next';
navSel.onchange=()=>{ mode=navSel.value; cur=-1; navPos.textContent=''; navSel.blur(); };   // blur: the arrow keys go back to stepping
/* The ← → keys step too, so the toolbar need not be on screen. A page that uses the arrows itself (a slide deck)
   can have them back: the toolbar switch is remembered per page. */
let keysOn=lsGet(LSKEYS)!=='off', toastT=null;
const keysBtn=btn('',()=>{ keysOn=!keysOn; lsSet(LSKEYS,keysOn?null:'off'); bar_(); },true);
keysBtn.title='Left and right arrow keys: step through the notes, or leave them to the page';
const toast=el('div','wmn-toast');
function say(t){ toast.textContent=t; toast.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>toast.classList.remove('on'),1500); }
function navEl(n){ const c=ROOT.querySelector('.wmn-card[data-id="'+n.id+'"]'); return c&&c.offsetParent?c:where.get(n.id); }
function navItems(m){ const f=MODES[m||mode][1]; return data.notes.filter(n=>where.has(n.id)&&f(n)).map(navEl).sort((a,b)=>a===b?0:a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING?-1:1); }
function jump(d){
  const L=navItems(); if(!L.length){ navPos.textContent='0/0'; say(MODES[mode][0]+': none'); return; }
  cur=cur<0?(d>0?0:L.length-1):(Math.min(cur,L.length-1)+d+L.length)%L.length;
  const e=L[cur]; e.scrollIntoView({block:'center'});
  e.classList.remove('wmn-flash'); void e.offsetWidth; e.classList.add('wmn-flash'); setTimeout(()=>e.classList.remove('wmn-flash'),1700);
  navPos.textContent=(cur+1)+'/'+L.length; say(MODES[mode][0]+': '+(cur+1)+' / '+L.length);
}
/* Open all / Close all: one button; "Close all" while any note on the page is open */
const cards=()=>data.notes.filter(n=>where.has(n.id)&&shown(n));
const allBtn2=btn('',()=>{
  const close=cards().some(n=>!n.collapsed), t=now();
  for(const n of cards()) if(!!n.collapsed!==close){ if(close) n.collapsed=true; else delete n.collapsed; n.updated=t; }
  changed(); rerender();
},true);
allBtn2.title='Open or close every note on the page';
const syncBtn=el('button','wmn-sync'); syncBtn.type='button'; let syncFix=null; syncBtn.onclick=()=>{ if(syncFix) syncFix(); };
function bar_(){
  const o=orphans().length;
  const h=data.notes.filter(n=>n.hl).length;
  info.textContent='Notes: '+data.notes.filter(n=>n.text).length+(h?' · Highlights: '+h:'');
  hideBtn.textContent=document.body.classList.contains('wmn-hide')?'Show':'Hide';
  orphBtn.textContent=o+' unattached'; orphBtn.style.display=o?'':'none';
  navSel.replaceChildren(...Object.entries(MODES).map(([k,[l]])=>{ const o=el('option','',l+' ('+navItems(k).length+')'); o.value=k; o.selected=k===mode; return o; }));
  const q=data.notes.filter(n=>n.ai).length, d=data.notes.filter(n=>n.status).length;
  keysBtn.textContent='← → '+(keysOn?'notes':'page');
  const C=cards(); allBtn2.textContent=C.some(n=>!n.collapsed)?'Close all':'Open all'; allBtn2.style.display=C.length?'':'none';
  aiInfo.textContent='For AI: '+q; allBtn.style.display=canSave?'':'none'; clrBtn.style.display=canSave&&q?'':'none';
  doneBtn.textContent=(document.body.classList.contains('wmn-hide-done')?'Show':'Hide')+' resolved ('+d+')'; doneBtn.style.display=d?'':'none';
}
/* The sync indicator. A warning says what is wrong and what a click on it will do. */
function show(state,msg){
  const S={
    synced:['✓ Synced',''], saving:['Saving…',''], readonly:['Read-only here: edit notes in Chrome',''],
    connect:['⚠ Not synced: click to choose the folder of this page','Your notes are kept in this browser until Chrome may write '+FILE+'. Choose the folder that contains '+HTML+'; Chrome remembers it.'],
    wrongdir:['⚠ That folder does not contain '+HTML+': click to choose again',''],
    allow:['⚠ Not synced: click to let Chrome write the notes file','Chrome asks again after a restart unless you choose "Allow on every visit". Your notes are kept in this browser until then.'],
    error:['⚠ Not synced: '+(msg||'')+'. Click to try again','Your notes are kept in this browser until the file is written.']};
  const [t,tip]=S[state]; syncBtn.textContent=t; syncBtn.title=tip; syncBtn.classList.toggle('warn',t[0]==='⚠');
  syncFix=state==='connect'||state==='wrongdir'?()=>sync('pick'):state==='allow'||state==='error'?()=>sync('edit'):null;
}
function panel(){
  if(pnl.style.display!=='block') return bar_();
  pnl.replaceChildren(el('div','wmn-old','Notes whose paragraph changed or disappeared. Reattach one by clicking a block of the page.'));
  for(const n of orphans()){
    const c=card(n); c.prepend(el('div','wmn-old','was near #'+(n.anchor||'?')+': '+n.fp.slice(0,60)+'…'));
    if(canSave) c.querySelector('.wmn-meta').append(btn('Reattach',()=>{ picking=n; pnl.style.display='none'; status.className=''; status.textContent='Click the block to attach the note to (Esc cancels)'; },true));
    pnl.append(c);
  }
  if(!orphans().length) pnl.style.display='none';
  bar_();

/* ---- sync: the notes file on disk and the page are kept equal ----
   IndexedDB keeps a folder handle shared by every page in the folder (or a file handle saved by an
   older version of this layer). Changes not yet on disk are also kept in localStorage. */
function idb(mode,key,val){
  return new Promise(res=>{ try{
    const r=indexedDB.open('wmn',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('h');
    r.onsuccess=()=>{ try{ const tx=r.result.transaction('h',mode?'readwrite':'readonly'), s=tx.objectStore('h');
      const q=mode?s.put(val,key):s.get(key); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }catch(e){ res(null); } };
    r.onerror=()=>res(null);
  }catch(e){ res(null); } });
}
function changed(){ data.updated=now(); dirty=true; lsSet(LS,JSON.stringify(data)); bar_(); sync('edit'); }
function merge(a,b){
  const gone=new Set([...(a.deleted||[]),...(b.deleted||[])]), m=new Map();
  for(const n of [...a.notes,...b.notes]){ if(gone.has(n.id)) continue; const o=m.get(n.id); if(!o||(n.updated||'')>(o.updated||'')) m.set(n.id,n); }
  return {version:1,updated:(a.updated||'')>(b.updated||'')?a.updated:b.updated,deleted:[...gone],
          notes:[...m.values()].sort((x,y)=>(x.created||'')<(y.created||'')?-1:1)};
}
function rerender(){
  if(ROOT.querySelector('.wmn-card textarea')) return;          // never pull a note away while it is being edited
  ROOT.querySelectorAll('.wmn-card').forEach(c=>c.remove()); where.clear();
  if(place()){ data.updated=now(); dirty=true; }
  panel();
}
async function readDisk(){
  const t=await (await fileH.getFile()).text(), i=t.indexOf('{'), j=t.lastIndexOf('}');
  if(i<0) return null; const d=JSON.parse(t.slice(i,j+1)); return Array.isArray(d.notes)?d:null;
}
async function writeDisk(){
  const w=await fileH.createWritable();
  await w.write('// Personal notes for '+HTML+'. Written by the page; edit with care.\nwindow.NOTES = '+JSON.stringify(data,null,1)+';\n');
  await w.close();
}
/* mode: 'auto' (no click: may only read and write), 'edit' (after a click: may ask for permission),
   'pick' (a click on the indicator or dialog: may also open the folder picker) */
async function sync(mode){
  if(!canSave) return show('readonly');
  if(busy){ again=true; return; } busy=true;
  try{
    if(!fileH&&!dirH){ const h=await idb(false,DIRKEY)||await idb(false,KEY); if(h&&h.kind==='directory') dirH=h; else if(h) fileH=h; }
    if(!fileH&&!dirH){
      if(mode==='pick') dirH=await showDirectoryPicker({id:'wmn',mode:'readwrite'});
      else { show(dirty?'connect':'synced'); if(dirty&&mode==='edit') ask(); return; }
    }
    const ph=dirH||fileH;
    if(await ph.queryPermission({mode:'readwrite'})!=='granted'){
      if(mode==='auto'||await ph.requestPermission({mode:'readwrite'})!=='granted') return show(dirty?'allow':'synced');
    }
    if(!fileH){
      try{ await dirH.getFileHandle(HTML); }catch(e){ dirH=null; return show('wrongdir'); }
      fileH=await dirH.getFileHandle(FILE,{create:true}); await idb(true,DIRKEY,dirH);
    }
    const disk=await readDisk();
    if(disk&&disk.updated!==diskStamp){                          // changed elsewhere since this page last read or wrote it
      data=dirty?merge(data,disk):disk;
      rerender();
    }
    if(dirty||!disk||disk.updated!==data.updated){ show('saving'); data.updated=data.updated||now(); await writeDisk(); }
    diskStamp=data.updated; dirty=false; lsSet(LS,null); show('synced');
  }catch(e){ show(e.name==='AbortError'?(dirty?'connect':'synced'):'error',e.message); }
  finally{ busy=false; bar_(); if(again){ again=false; sync('auto'); } }
}
function ask(){
  if(document.querySelector('.wmn-dialog')) return;
  const d=el('div','wmn-dialog'), row=el('div','wmn-meta');
  row.append(btn('Choose folder',()=>{ d.remove(); sync('pick'); }),btn('Later',()=>d.remove(),true));
  d.append(el('p','','Keep these notes in sync with the file '+FILE+'?'),
           el('p','wmn-old','Chrome needs permission to write in the folder that contains '+HTML+'. Choose that folder in the next window. You do this once per folder. Until then your notes are kept in this browser.'),row);
  document.body.append(d);
}

/* ---- start (after MathJax has typeset, if the page uses it; KaTeX auto-render runs before us) ---- */
function init(){
  ROOT=document.querySelector('main')||document.body;
  document.head.append(el('style','',Object.entries(COLORS).map(([k,v])=>'::highlight(wmn-'+k+'){background-color:'+v+'}').join('\n')
    +'\n::highlight(wmn-diff){background-color:rgba(46,107,52,.22);text-decoration-line:underline;text-decoration-color:#2E6B34}'
    +'\n::highlight(wmn-strike){text-decoration-line:line-through;text-decoration-color:#C0392B;text-decoration-thickness:2px;background-color:rgba(192,57,43,.1)}'));
  diskStamp=data.updated||null;                              // what the notes.js <script> read from disk
  const pending=lsGet(LS);
  if(pending){ try{ const p=JSON.parse(pending); if((p.updated||'')>(data.updated||'')){ data=merge(p,data); dirty=true; } }catch(e){} }
  if(lsGet(LSHIDE)) document.body.classList.add('wmn-hide');
  if(lsGet(LSDONE)) document.body.classList.add('wmn-hide-done');
  const moved=place();
  bar.append(info,navSel,prevB,navPos,nextB,keysBtn,allBtn2,aiInfo,allBtn,clrBtn,doneBtn,orphBtn,hideBtn,syncBtn,status); document.body.append(bar,pnl);
  // the bar spans the window; space at the end of the page, as tall as the bar, keeps the last lines readable
  const pad=el('div','wmn-pad'); pad.setAttribute('aria-hidden','true'); document.body.append(pad);
  const fit=()=>{ pad.style.height=(bar.offsetHeight+24)+'px'; };
  if(window.ResizeObserver) new ResizeObserver(fit).observe(bar); else fit();
  /* The bar has the width of the page's text column: the typical left edge and width of its paragraphs */
  const align=()=>{
    const P=[...ROOT.querySelectorAll('p')].filter(x=>!x.closest(OURS)).map(x=>x.getBoundingClientRect()).filter(r=>r.width>200).slice(0,40);
    if(!P.length){ bar.style.left=bar.style.width=''; bar.style.right=''; return; }
    const med=a=>a.sort((x,y)=>x-y)[a.length>>1], l=Math.max(4,med(P.map(r=>r.left)));
    bar.style.left=l+'px'; bar.style.right='auto'; bar.style.width=Math.min(med(P.map(r=>r.width)),innerWidth-l-4)+'px';
  };
  align(); setTimeout(align,1000); window.addEventListener('resize',align);
  if(lsGet(LSBAR)) bar.classList.add('wmn-off');
  if(moved){ data.updated=now(); dirty=true; lsSet(LS,JSON.stringify(data)); }
  bar_(); sync('auto');
  window.wmnNotes=()=>data;   // for check_notes.py and debugging
  document.body.append(toast);
  /* Esc opens or closes the note under the pointer. Esc keeps its other jobs first (popup, typing, Reattach);
     with no note under the pointer, the page gets the key. */
  // capture on window: the page's own handlers cannot hide the pointer from us
  window.addEventListener('mouseover',e=>{ const c=e.target.closest&&e.target.closest('.wmn-card'); hoverId=c?c.dataset.id:null; },true);
  let lastY=-1; window.addEventListener('mousemove',e=>{ lastY=e.clientY; },{capture:true,passive:true});
  /* Esc near the bottom of the window (within the bar's height, or 60px while it is hidden) hides or shows the bar */
  const nearBottom=()=>lastY>=0&&lastY>=innerHeight-(bar.classList.contains('wmn-off')?60:bar.offsetHeight+24);
  const toggleBar=()=>{
    const off=bar.classList.toggle('wmn-off'); lsSet(LSBAR,off?'1':null);
    say(off?'Toolbar hidden: press Esc near the bottom to show it':'Toolbar shown');
  };
  const onScreen=id=>{ const c=document.querySelector('.wmn-card[data-id="'+id+'"]'); if(!c||!c.offsetParent) return false; const r=c.getBoundingClientRect(); return r.bottom>0&&r.top<innerHeight; };
  window.addEventListener('keydown',e=>{
    if(e.key!=='Escape'||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||picking) return;
    const pp=document.querySelector('.wmn-pop'); if(pp&&pp.style.display==='flex') return;
    if(inside(e.target,TYPING)) return;
    if(nearBottom()){ e.preventDefault(); e.stopImmediatePropagation(); toggleBar(); return; }   // the bottom of the window belongs to the bar
    const n=hoverId&&onScreen(hoverId)&&data.notes.find(x=>x.id===hoverId);
    if(!n||!shown(n)) return;
    e.preventDefault(); e.stopImmediatePropagation(); toggle(n);
  },true);
  let diffB=null;               // hovering a changed paragraph marks its new words
  document.addEventListener('mouseover',e=>{ const b=blockAt(e.target); if(!b||b===diffB) return; diffB=b; showDiff(data.notes.find(n=>n.was&&where.get(n.id)===b)||null); });
  window.addEventListener('keydown',e=>{        // capture: before the page's own handlers, which then do not see the key
    if(!keysOn||picking||(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey) return;
    if(inside(e.target,OWNKEYS)) return;
    e.preventDefault(); e.stopImmediatePropagation(); jump(e.key==='ArrowRight'?1:-1);
  },true);
  if(!canSave) return;
  const recheck=()=>{ if(document.visibilityState==='visible') sync('auto'); };
  window.addEventListener('focus',recheck); document.addEventListener('visibilitychange',recheck);

  const add=el('button','wmn-add','+'); add.type='button'; add.title='Add a note below this block'; document.body.append(add);
  document.addEventListener('mouseover',e=>{
    if(e.target===add) return;
    const b=blockAt(e.target); if(!b) return;
    if(picking){ if(target) target.classList.remove('wmn-target'); b.classList.add('wmn-target'); }
    target=b; const r=b.getBoundingClientRect();
    add.style.top=(r.top+scrollY)+'px'; add.style.left=Math.max(4,r.left+scrollX-30)+'px'; add.style.display=picking?'none':'block';
  });
  add.onclick=()=>{
    if(!target) return;
    const list=listFor(target);
    const n={id:'n'+Date.now().toString(36),tag:target.tagName,fp:fp(target),anchor:anchorOf(target),k:list.indexOf(target),text:'',created:now(),updated:now()};
    context(n,target);
    where.set(n.id,target); const c=el('div','wmn-card'); c.dataset.id=n.id; after(target,c); edit(n,c,true);
  };
  document.addEventListener('click',e=>{
    if(!picking) return; const b=blockAt(e.target); if(!b) return;
    e.preventDefault(); e.stopPropagation(); b.classList.remove('wmn-target');
    const n=picking, list=listFor(b);
    Object.assign(n,{tag:b.tagName,fp:fp(b),anchor:anchorOf(b),k:list.indexOf(b),updated:now()}); context(n,b);
    const r=n.hl&&locate(b,n.hl);                 // a highlight whose words are not in this block becomes a note quoting them
    if(r){ rng.set(n.id,r); paint(); } else if(n.hl){ n.text=('“'+n.hl.quote+'” '+n.text).trim(); delete n.hl; }
    picking=null; where.set(n.id,b); if(shown(n)) after(b,card(n)); changed();
  },true);

  /* highlights: select text, then pick a colour or "Note"; click a highlight to recolour it, edit its note or delete it */
  const pop=el('div','wmn-pop'); document.body.append(pop);
  const hide=()=>{ pop.style.display='none'; };
  pop.addEventListener('mousedown',e=>e.preventDefault());      // keep the selection while a button is pressed
  function noteFor(n){
    const b=where.get(n.id); if(!b) return;
    const old=ROOT.querySelector('.wmn-card[data-id="'+n.id+'"]'), c=old||el('div','wmn-card');
    if(!old){ c.dataset.id=n.id; after(b,c); } edit(n,c,false);
  }
  function popup(x,y,n,make){     // n: the clicked highlight; or null, and make() creates one from the selection
    const get=()=>n||(n=make()), done=()=>{ hide(); getSelection().removeAllRanges(); };
    pop.replaceChildren(...(n&&n.strike?[]:Object.keys(COLORS)).map(k=>{
      const s=btn('',()=>{ const h=get(); h.hl.color=k; h.updated=now(); done(); paint(); changed(); });
      s.className='wmn-sw'+(n&&n.hl.color===k?' on':''); s.style.background=COLORS[k]; s.title='Highlight'; return s;
    }), btn(n&&n.text?'Edit note':'Note',()=>{ const h=get(); done(); noteFor(h); },true),
        btn(n&&n.ai?'✓ For AI':'For AI',()=>{ const h=get(); done(); toggleAI(h); },true));
    if(!n){ const s=btn('Strike',()=>{ const h=get(); h.strike=true; h.ai=true; h.updated=now(); done(); paint(); changed(); },true); s.title='Cross out: the AI deletes these words'; pop.append(s); }
    if(n) pop.append(btn(n.strike?'Remove strike':'Delete',()=>{ hide(); if(n.strike) unstrike(n); else del(n); },true));
    pop.style.left=Math.max(4,x+scrollX)+'px'; pop.style.top=(y+scrollY+6)+'px'; pop.style.display='flex';
  }
  document.addEventListener('mouseup',e=>{
    if(picking||(e.target.closest&&e.target.closest('.wmn-pop'))) return;
    setTimeout(()=>{
      const s=getSelection();
      if(s.rangeCount&&!s.isCollapsed){
        const r=s.getRangeAt(0), sc=r.startContainer, b=blockAt(sc.nodeType===1?sc:sc.parentElement), h=b&&grab(b,r);
        if(!h) return hide();
        const box=r.getBoundingClientRect();
        return popup(box.left,box.bottom,null,()=>{
          const n={id:'h'+Date.now().toString(36),tag:b.tagName,fp:fp(b),anchor:anchorOf(b),k:listFor(b).indexOf(b),text:'',hl:Object.assign(h,{color:'y'}),created:now(),updated:now()};
          context(n,b); data.notes.push(n); where.set(n.id,b); rng.set(n.id,locate(b,n.hl)); paint(); changed(); return n;
        });
      }
      const p=document.caretRangeFromPoint&&document.caretRangeFromPoint(e.clientX,e.clientY);
      const n=p&&data.notes.find(x=>{ const r=rng.get(x.id); return r&&r.isPointInRange(p.startContainer,p.startOffset); });
      if(n) popup(e.clientX,e.clientY+10,n); else hide();
    });
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') hide(); if(e.key==='Escape'&&picking){ picking=null; if(target) target.classList.remove('wmn-target'); status.textContent=''; bar_(); } });
}
function start(){
  const mj=window.MathJax&&MathJax.startup&&MathJax.startup.promise;
  (mj?mj.catch(()=>{}):Promise.resolve()).then(init);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>
