<!-- Personal notes layer (html-notes skill). Notes live in __NOTES_FILE__ next to this file.
     Each note is attached to a block (paragraph, equation, figure, ...) by a fingerprint of its text,
     so notes survive edits elsewhere in the page. A note whose block was edited follows it (matched by
     word overlap and by its old neighbours); a note whose block was deleted is listed as "unattached".
     Sync: in Chrome the page writes every change to the notes file at once (File System Access API, after a
     one-time "choose folder" step), and re-reads the file when the tab regains focus; changes from two places
     are merged by note id. Other browsers show the notes read-only. Re-run add_notes.py to update this block.
     Highlights: select text, pick a colour or add a note. A highlight is stored with its block like a note, plus
     its words and the 32 characters on each side, and is drawn with the CSS Custom Highlight API (no DOM change).
     AI queue: "For AI" marks a note (ai:true) for an AI, which records the outcome with resolve_notes.py
     (status fixed/answered/declined + resolution); the card shows it, and resolved notes can be hidden.
     Strike: crossed-out words (strike:true) are queued for the AI to delete. Step-through: the toolbar's
     ◀ ▶ (or the ← → keys) visit all items, the AI results not yet reviewed, or the notes whose paragraph changed (n.was). -->

<script>

let mode='all', cur=-1, hoverId=null, stepId=null, peekId=null;   // hoverId: the note under the pointer
navSel.setAttribute('aria-label','Step through'); prevB.title='Previous'; nextB.title='Next';
navSel.onchange=()=>{ mode=navSel.value; cur=-1; navPos.textContent=''; navSel.blur(); };   // blur: the arrow keys go back to stepping
/* The ← → keys step too, so the toolbar need not be on screen. A page that uses the arrows itself (a slide deck)
   can have them back: the toolbar switch is remembered per page. */
let keysOn=lsGet(LSKEYS)!=='off', toastT=null;
const keysBtn=btn('',()=>{ keysOn=!keysOn; lsSet(LSKEYS,keysOn?null:'off'); bar_(); },true);
keysBtn.title='Left and right arrow keys: step through the notes, or leave them to the page';
const toast=el('div','wmn-toast');
function say(t){ toast.textContent=t; toast.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>toast.classList.remove('on'),1500); }
function navEl(n){ const c=document.querySelector('.wmn-card[data-id="'+n.id+'"]'); return c&&c.getClientRects().length?c:where.get(n.id); }
function navItems(m){       // the items of a list in page order. Deck cards live in their own layer, so there the order is that of their blocks.
  const f=MODES[m||mode][1], key=n=>DECK?where.get(n.id):navEl(n);
  return data.notes.filter(n=>where.has(n.id)&&f(n)).sort((a,b)=>{ const x=key(a), y=key(b); return x===y?0:x.compareDocumentPosition(y)&Node.DOCUMENT_POSITION_FOLLOWING?-1:1; });
}
/* Bring up the slide that holds a block, by pressing the deck's own arrow keys. Decks differ, so this asks nothing of them. */
function showBlock(b){
  const first=()=>LIST.find(isVis); let stuck=0;
  pressing=true;
  try{
    for(let i=0;i<300&&stuck<3&&!isVis(b);i++){
      const f=first(), key=!f||(f.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING)?'ArrowRight':'ArrowLeft';
      for(const t of ['keydown','keyup']) document.body.dispatchEvent(new KeyboardEvent(t,{key,code:key,bubbles:true,cancelable:true}));
      stuck=first()===f?stuck+1:0;
    }
  }finally{ pressing=false; }
  return isVis(b);
}
/* A slide with its own scrollbar: scroll it to the block. The page itself never scrolls on a deck. */
function reveal(b){
  for(let e=b.parentElement;e&&e!==document.body;e=e.parentElement){
    if(!/auto|scroll/.test(getComputedStyle(e).overflowY)||e.scrollHeight<=e.clientHeight) continue;
    const r=b.getBoundingClientRect(), q=e.getBoundingClientRect();
    if(r.top<q.top||r.bottom>q.bottom) e.scrollTop+=r.top-q.top-q.height/3;
    return;
  }
}
function jump(d){
  const L=navItems(); if(!L.length){ navPos.textContent='0/0'; say(MODES[mode][0]+': none'); return; }
  const k=cur<0?(d>0?0:L.length-1):(Math.min(cur,L.length-1)+d+L.length)%L.length, n=L[k], b=where.get(n.id);
  if(DECK&&layer.querySelector('textarea')&&!isVis(b)){ say('Save or cancel the open note to go to another slide'); return; }
  cur=k;
  if(DECK){ if(!showBlock(b)) say('That note is on a slide that could not be opened'); else reveal(b); layout(); }
  const e=navEl(n); if(!DECK) e.scrollIntoView({block:'center'});
  stepId=n.id; peekId=null;
  e.classList.remove('wmn-flash'); void e.offsetWidth; e.classList.add('wmn-flash'); setTimeout(()=>e.classList.remove('wmn-flash'),1700);
  navPos.textContent=(cur+1)+'/'+L.length;
  if(isVis(b)) say(MODES[mode][0]+': '+(cur+1)+' / '+L.length);
}
/* Open all / Close all: one button; "Close all" while any note on the page is open */
const cards=()=>data.notes.filter(n=>where.has(n.id)&&shown(n));
const allBtn2=btn('',()=>{
  const close=cards().some(n=>!n.collapsed), t=now();
  for(const n of cards()) if(!!n.collapsed!==close){ if(close) n.collapsed=true; else delete n.collapsed; n.updated=t; }
  changed(); rerender();
},true);
allBtn2.title='Open or close every note on the page';
const syncBtn=el('button','wmn-sync'); syncBtn.type='button'; let syncFix=null; syncBtn.onclick=()=>{ if(syncFix) syncFix(); };
function bar_(){
  const o=orphans().length;
  const h=data.notes.filter(n=>n.hl).length;
  info.textContent='Notes: '+data.notes.filter(n=>n.text).length+(h?' · Highlights: '+h:'');
  orphBtn.textContent=o+' unattached'; orphBtn.style.display=o?'':'none';
  navSel.replaceChildren(...Object.entries(MODES).map(([k,[l]])=>{ const o=el('option','',l+' ('+navItems(k).length+')'); o.value=k; o.selected=k===mode; return o; }));
  const q=data.notes.filter(n=>n.ai).length, d=data.notes.filter(n=>n.status).length;
  keysBtn.textContent='← → '+(keysOn?'notes':'page'); keysBtn.style.display=DECK?'none':'';   // on a deck, ← → always belong to the slides
  const C=cards(); allBtn2.textContent=C.some(n=>!n.collapsed)?'Close all':'Open all'; allBtn2.style.display=C.length?'':'none';
  aiInfo.textContent='For AI: '+q; allBtn.style.display=canSave?'':'none'; clrBtn.style.display=canSave&&q?'':'none';
  doneBtn.textContent=(document.body.classList.contains('wmn-hide-done')?'Show':'Hide')+' resolved ('+d+')'; doneBtn.style.display=d?'':'none';
}
/* The sync indicator. A warning says what is wrong and what a click on it will do. */
function show(state,msg){
  const S={
    synced:['✓ Synced',''], saving:['Saving…',''], readonly:['Read-only here: edit notes in Chrome',''],
    foreign:['⚠ Read-only: this page has no notes file of its own. Run add_notes.py on it','Its notes code was made for '+HTML+' and links '+FILE+'. A notes file belongs to one page.'],
    connect:['⚠ Not synced: click to choose the folder of this page','Your notes are kept in this browser until Chrome may write '+FILE+'. Choose the folder that contains '+HTML+'; Chrome remembers it.'],
    wrongdir:['⚠ That folder does not contain '+HTML+': click to choose again',''],
    allow:['⚠ Not synced: click to let Chrome write the notes file','Chrome asks again after a restart unless you choose "Allow on every visit". Your notes are kept in this browser until then.'],
    error:['⚠ Not synced: '+(msg||'')+'. Click to try again','Your notes are kept in this browser until the file is written.']};
  const [t,tip]=S[state]; syncBtn.textContent=t; syncBtn.title=tip; syncBtn.classList.toggle('warn',t[0]==='⚠');
  syncFix=state==='connect'||state==='wrongdir'?()=>sync('pick'):state==='allow'||state==='error'?()=>sync('edit'):null;
}
function panel(){
  if(pnl.style.display!=='block') return bar_();
  pnl.replaceChildren(el('div','wmn-old','Notes whose paragraph changed or disappeared. Reattach one by clicking a block of the page.'));
  for(const n of orphans()){
    const c=card(n); c.prepend(el('div','wmn-old','was near #'+(n.anchor||'?')+': '+n.fp.slice(0,60)+'…'));
    if(canSave) c.querySelector('.wmn-meta').append(btn('Reattach',()=>{ picking=n; pnl.style.display='none'; status.className=''; status.textContent='Click the block to attach the note to (Esc cancels)'; },true));
    pnl.append(c);
  }
  if(!orphans().length) pnl.style.display='none';
  bar_();
}

/* ---- sync: the notes file on disk and the page are kept equal ----
   IndexedDB keeps a folder handle shared by every page in the folder (or a file handle saved by an
   older version of this layer). Changes not yet on disk are also kept in localStorage. */
function idb(mode,key,val){
  return new Promise(res=>{ try{
    const r=indexedDB.open('wmn',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('h');
    r.onsuccess=()=>{ try{ const tx=r.result.transaction('h',mode?'readwrite':'readonly'), s=tx.objectStore('h');
      const q=mode?s.put(val,key):s.get(key); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }catch(e){ res(null); } };
    r.onerror=()=>res(null);
  }catch(e){ res(null); } });
}
function changed(){ data.updated=now(); dirty=true; lsSet(LS,JSON.stringify(data)); bar_(); sync('edit'); }
function merge(a,b){
  const gone=new Set([...(a.deleted||[]),...(b.deleted||[])]), m=new Map();
  for(const n of [...a.notes,...b.notes]){ if(gone.has(n.id)) continue; const o=m.get(n.id); if(!o||(n.updated||'')>(o.updated||'')) m.set(n.id,n); }
  return {version:1,updated:(a.updated||'')>(b.updated||'')?a.updated:b.updated,deleted:[...gone],
          notes:[...m.values()].sort((x,y)=>(x.created||'')<(y.created||'')?-1:1)};
}
function rerender(){
  if(document.querySelector('.wmn-card textarea')) return;          // never pull a note away while it is being edited
  document.querySelectorAll('.wmn-card:not(.wmn-panel .wmn-card)').forEach(c=>c.remove()); where.clear();
  if(place()){ data.updated=now(); dirty=true; }
  panel();
}
async function readDisk(){
  const t=await (await fileH.getFile()).text(), i=t.indexOf('{'), j=t.lastIndexOf('}');
  if(i<0) return null; const d=JSON.parse(t.slice(i,j+1)); return Array.isArray(d.notes)?d:null;
}
async function writeDisk(){
  const w=await fileH.createWritable();
  await w.write('// Personal notes for '+HTML+'. Written by the page; edit with care.\nwindow.NOTES = '+JSON.stringify(data,null,1)+';\n');
  await w.close();
}
/* mode: 'auto' (no click: may only read and write), 'edit' (after a click: may ask for permission),
   'pick' (a click on the indicator or dialog: may also open the folder picker) */
async function sync(mode){
  if(!canSave) return show(foreign?'foreign':'readonly');
  if(busy){ again=true; return; } busy=true;
  try{
    if(!fileH&&!dirH){ const h=await idb(false,DIRKEY)||await idb(false,KEY); if(h&&h.kind==='directory') dirH=h; else if(h) fileH=h; }
    if(!fileH&&!dirH){
      if(mode==='pick') dirH=await showDirectoryPicker({id:'wmn',mode:'readwrite'});
      else { show(dirty?'connect':'synced'); if(dirty&&mode==='edit') ask(); return; }
    }
    const ph=dirH||fileH;
    if(await ph.queryPermission({mode:'readwrite'})!=='granted'){
      if(mode==='auto'||await ph.requestPermission({mode:'readwrite'})!=='granted') return show(dirty?'allow':'synced');
    }
    if(!fileH){
      try{ await dirH.getFileHandle(HTML); }catch(e){ dirH=null; return show('wrongdir'); }
      fileH=await dirH.getFileHandle(FILE,{create:true}); await idb(true,DIRKEY,dirH);
    }
    const disk=await readDisk();
    if(disk&&disk.updated!==diskStamp){                          // changed elsewhere since this page last read or wrote it
      data=dirty?merge(data,disk):disk;
      rerender();
    }
    if(dirty||!disk||disk.updated!==data.updated){ show('saving'); data.updated=data.updated||now(); await writeDisk(); }
    diskStamp=data.updated; dirty=false; lsSet(LS,null); show('synced');
  }catch(e){ show(e.name==='AbortError'?(dirty?'connect':'synced'):'error',e.message); }
  finally{ busy=false; bar_(); if(again){ again=false; sync('auto'); } }
}
/* Yes: choose the folder. Later: ask again the next time the page is opened. No: never ask for this page (the toolbar's warning still offers it). */
let askLater=false;
function ask(){
  if(askLater||lsGet(LSNOASK)||document.querySelector('.wmn-dialog')) return;
  const d=el('div','wmn-dialog'), row=el('div','wmn-meta');
  const yes=btn('Yes, choose folder',()=>{ d.remove(); sync('pick'); }), later=btn('Later',()=>{ askLater=true; d.remove(); },true), nope=btn('No',()=>{ lsSet(LSNOASK,'1'); d.remove(); },true);
  later.title='Ask again the next time you open this page'; nope.title='Do not ask again for this page. The red warning in the toolbar still lets you connect.';
  row.append(yes,later,nope);
  d.append(el('p','','Save your notes to the file '+FILE+'?'),
           el('p','wmn-old','Your notes are now only in this browser, so clearing its data or using another browser would lose them. Yes: Chrome writes every change to that file, next to '+HTML+', and rereads it when you return to the tab. Chrome needs your permission for the folder, once per folder. Later: ask again next time. No: do not ask again for this page.'),row);
  document.body.append(d);
}

/* ---- start (after MathJax has typeset, if the page uses it; KaTeX auto-render runs before us) ---- */
function init(){
  ROOT=document.querySelector('main')||document.body;
  document.head.append(el('style','',Object.entries(COLORS).map(([k,v])=>'::highlight(wmn-'+k+'){background-color:'+v+'}').join('\n')
    +'\n::highlight(wmn-diff){background-color:rgba(46,107,52,.22);text-decoration-line:underline;text-decoration-color:#2E6B34}'
    +'\n::highlight(wmn-strike){text-decoration-line:line-through;text-decoration-color:#C0392B;text-decoration-thickness:2px;background-color:rgba(192,57,43,.1)}'));
  diskStamp=data.updated||null;                              // what the notes.js <script> read from disk
  const pending=lsGet(LS);
  if(pending){ try{ const p=JSON.parse(pending); if((p.updated||'')>(data.updated||'')){ data=merge(p,data); dirty=true; } }catch(e){} }
  if(lsGet(LSHIDE)) document.body.classList.add('wmn-hide');
  if(lsGet(LSDONE)) document.body.classList.add('wmn-hide-done');
  const B0=getComputedStyle(document.body).overflow, H0=getComputedStyle(document.documentElement).overflow, D=document.documentElement;
  DECK=B0==='hidden'||H0==='hidden'||(D.scrollHeight<=innerHeight+1&&[...ROOT.querySelectorAll(BLOCKS)].some(b=>!b.closest(OURS)&&!isVis(b)));
  if(DECK){
    document.body.append(layer);
    (function tick(){ layout(); requestAnimationFrame(tick); })();                 // keep the notes with their blocks
    dragging();
    document.body.append(markEl);
  }
  const moved=place();
  bar.append(info,navSel,prevB,navPos,nextB,keysBtn,allBtn2,aiInfo,allBtn,clrBtn,doneBtn,orphBtn,hideBtn,syncBtn,status); document.body.append(bar,pnl);
  // the bar spans the window; space at the end of the page, as tall as the bar, keeps the last lines readable
  const pad=el('div','wmn-pad'); pad.setAttribute('aria-hidden','true'); document.body.append(pad);
  const fit=()=>{ pad.style.height=(bar.offsetHeight+24)+'px'; };
  if(window.ResizeObserver) new ResizeObserver(fit).observe(bar); else fit();
  /* The bar has the width of the page's text column: the typical left edge and width of its paragraphs */
  const align=()=>{
    const P=[...ROOT.querySelectorAll('p')].filter(x=>!x.closest(OURS)).map(x=>x.getBoundingClientRect()).filter(r=>r.width>200).slice(0,40);
    if(!P.length){ bar.style.left=bar.style.width=''; bar.style.right=''; return; }
    const med=a=>a.sort((x,y)=>x-y)[a.length>>1], l=Math.max(4,med(P.map(r=>r.left)));
    bar.style.left=l+'px'; bar.style.right='auto'; bar.style.width=Math.min(med(P.map(r=>r.width)),innerWidth-l-4)+'px';
  };
  align(); setTimeout(align,1000); window.addEventListener('resize',align);
  if(lsGet(LSBAR)) bar.classList.add('wmn-off');
  if(moved){ data.updated=now(); dirty=true; lsSet(LS,JSON.stringify(data)); }
  bar_(); sync('auto');
  window.wmnNotes=()=>data;   // for check_notes.py and debugging
  document.body.append(toast);
  const onBtn=btn('Turn notes on (N)',()=>setOff(false)); onBtn.className='wmn-on'; document.body.append(onBtn);
  /* Esc opens or closes the note under the pointer. Esc keeps its other jobs first (popup, typing, Reattach);
     with no note under the pointer, the page gets the key. */
  // capture on window: the page's own handlers cannot hide the pointer from us
  window.addEventListener('mouseover',e=>{ const c=e.target.closest&&e.target.closest('.wmn-card'); hoverId=c?c.dataset.id:null; },true);
  let lastY=-1; window.addEventListener('mousemove',e=>{ lastY=e.clientY; },{capture:true,passive:true});
  /* Esc near the bottom of the window (within the bar's height, or 60px while it is hidden) hides or shows the bar */
  const nearBottom=()=>lastY>=0&&lastY>=innerHeight-(bar.classList.contains('wmn-off')?60:bar.offsetHeight+24);
  const toggleBar=()=>{
    const off=bar.classList.toggle('wmn-off'); lsSet(LSBAR,off?'1':null);
    say(off?'Toolbar hidden: press Esc near the bottom to show it':'Toolbar shown');
  };
  const onScreen=id=>{ const c=document.querySelector('.wmn-card[data-id="'+id+'"]'); if(!c||!c.getClientRects().length) return false; const r=c.getBoundingClientRect(); return r.bottom>0&&r.top<innerHeight; };
  window.addEventListener('keydown',e=>{
    if(isOff()||e.key!=='Escape'||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||picking) return;
    const pp=document.querySelector('.wmn-pop'); if(pp&&pp.style.display==='flex') return;
    if(inside(e.target,TYPING)) return;
    if(nearBottom()){ e.preventDefault(); e.stopImmediatePropagation(); toggleBar(); return; }   // the bottom of the window belongs to the bar
    const n=hoverId&&onScreen(hoverId)&&data.notes.find(x=>x.id===hoverId);
    if(!n||!shown(n)) return;
    e.preventDefault(); e.stopImmediatePropagation(); toggle(n);
  },true);
  let diffB=null;               // hovering a changed paragraph marks its new words
  document.addEventListener('mouseover',e=>{ const b=blockAt(e.target); if(isOff()||!b||b===diffB) return; diffB=b; showDiff(data.notes.find(n=>n.was&&where.get(n.id)===b)||null); });
  window.addEventListener('keydown',e=>{        // capture: before the page's own handlers, which then do not see the key
    if(DECK||isOff()||!keysOn||picking||(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey) return;
    if(inside(e.target,OWNKEYS)) return;
    e.preventDefault(); e.stopImmediatePropagation(); jump(e.key==='ArrowRight'?1:-1);
  },true);
  if(!canSave) return;
  const recheck=()=>{ if(document.visibilityState==='visible') sync('auto'); };
  window.addEventListener('focus',recheck); document.addEventListener('visibilitychange',recheck);

  const add=el('button','wmn-add','+'); add.type='button'; add.title='Add a note below this block'; document.body.append(add);
  document.addEventListener('mouseover',e=>{
    if(e.target===add) return;
    const b=blockAt(e.target); if(!b) return;
    if(picking){ if(target) target.classList.remove('wmn-target'); b.classList.add('wmn-target'); }
    target=b; const r=b.getBoundingClientRect();
    add.style.top=(r.top+scrollY)+'px'; add.style.left=Math.max(4,r.left+scrollX-30)+'px'; add.style.display=picking?'none':'block';
  });
  add.onclick=()=>{
    if(!target) return;
    const list=listFor(target);
    const n={id:'n'+Date.now().toString(36),tag:target.tagName,fp:fp(target),anchor:anchorOf(target),k:list.indexOf(target),text:'',created:now(),updated:now()};
    context(n,target);
    where.set(n.id,target); const c=el('div','wmn-card'); c.dataset.id=n.id; after(target,c); edit(n,c,true);
  };
  document.addEventListener('click',e=>{
    if(!picking) return; const b=blockAt(e.target); if(!b) return;
    e.preventDefault(); e.stopPropagation(); b.classList.remove('wmn-target');
    const n=picking, list=listFor(b);
    Object.assign(n,{tag:b.tagName,fp:fp(b),anchor:anchorOf(b),k:list.indexOf(b),updated:now()}); context(n,b);
    const r=n.hl&&locate(b,n.hl);                 // a highlight whose words are not in this block becomes a note quoting them
    if(r){ rng.set(n.id,r); paint(); } else if(n.hl){ n.text=('“'+n.hl.quote+'” '+n.text).trim(); delete n.hl; }
    picking=null; where.set(n.id,b); if(shown(n)) after(b,card(n)); changed();
  },true);

  /* highlights: select text, then pick a colour or "Note"; click a highlight to recolour it, edit its note or delete it */
  const pop=el('div','wmn-pop'); document.body.append(pop);
  const hide=()=>{ pop.style.display='none'; };
  pop.addEventListener('mousedown',e=>e.preventDefault());      // keep the selection while a button is pressed
  function noteFor(n){
    const b=where.get(n.id); if(!b) return;
    const old=document.querySelector('.wmn-card[data-id="'+n.id+'"]'), c=old||el('div','wmn-card');
    if(!old){ c.dataset.id=n.id; after(b,c); } edit(n,c,false);
  }
  function popup(x,y,n,make){     // n: the clicked highlight; or null, and make() creates one from the selection
    const get=()=>n||(n=make()), done=()=>{ hide(); getSelection().removeAllRanges(); };
    pop.replaceChildren(...(n&&n.strike?[]:Object.keys(COLORS)).map(k=>{
      const s=btn('',()=>{ const h=get(); h.hl.color=k; h.updated=now(); done(); paint(); changed(); });
      s.className='wmn-sw'+(n&&n.hl.color===k?' on':''); s.style.background=COLORS[k]; s.title='Highlight'; return s;
    }), btn(n&&n.text?'Edit note':'Note',()=>{ const h=get(); done(); noteFor(h); },true),
        btn(n&&n.ai?'✓ For AI':'For AI',()=>{ const h=get(); done(); toggleAI(h); },true));
    if(!n){ const s=btn('Strike',()=>{ const h=get(); h.strike=true; h.ai=true; h.updated=now(); done(); paint(); changed(); },true); s.title='Cross out: the AI deletes these words'; pop.append(s); }
    if(n) pop.append(btn(n.strike?'Remove strike':'Delete',()=>{ hide(); if(n.strike) unstrike(n); else del(n); },true));
    pop.style.left=Math.max(4,x+scrollX)+'px'; pop.style.top=(y+scrollY+6)+'px'; pop.style.display='flex';
  }
  document.addEventListener('mouseup',e=>{
    if(picking||(e.target.closest&&e.target.closest('.wmn-pop'))) return;
    setTimeout(()=>{
      const s=getSelection();
      if(s.rangeCount&&!s.isCollapsed){
        const r=s.getRangeAt(0), sc=r.startContainer, b=blockAt(sc.nodeType===1?sc:sc.parentElement), h=b&&grab(b,r);
        if(!h) return hide();
        const box=r.getBoundingClientRect();
        return popup(box.left,box.bottom,null,()=>{
          const n={id:'h'+Date.now().toString(36),tag:b.tagName,fp:fp(b),anchor:anchorOf(b),k:listFor(b).indexOf(b),text:'',hl:Object.assign(h,{color:'y'}),created:now(),updated:now()};
          context(n,b); data.notes.push(n); where.set(n.id,b); rng.set(n.id,locate(b,n.hl)); paint(); changed(); return n;
        });
      }
      const p=document.caretRangeFromPoint&&document.caretRangeFromPoint(e.clientX,e.clientY);
      const n=p&&data.notes.find(x=>{ const r=rng.get(x.id); return r&&r.isPointInRange(p.startContainer,p.startOffset); });
      if(n) popup(e.clientX,e.clientY+10,n); else hide();
    });
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') hide(); if(e.key==='Escape'&&picking){ picking=null; if(target) target.classList.remove('wmn-target'); status.textContent=''; bar_(); } });
}
function start(){
  const mj=window.MathJax&&MathJax.startup&&MathJax.startup.promise;
  (mj?mj.catch(()=>{}):Promise.resolve()).then(init);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>
